<h1>『高三爱情故事』第17話の視聴メモ</h1>
<p>『高三爱情故事』第17話は、高校生活を舞台にした恋愛シリーズの続きとして公開されている。第17話まで追っていて、物語を続けて確認したい人向けの回だ。</p>
<p>AnimeX / 动漫星球では短編ドラマを話数ごとに整理しており、登録せずに作品ページを開ける。今回確認した入口は<a href="https://www.dh.video/video/creator-work-1788389336853938671">AnimeXで『高三爱情故事』第17話を見る</a>。</p>
<p>作品名と話数は実際の再生ページで照合した。同じシリーズを追う場合は、作品ページからほかの話数も確認できる。</p>
